<!DOCTYPE html>
<html>

<head>
  <title>Todo App</title>
  <link href="https://fonts.googleapis.com/css?family=Lato:300,400,700" rel="stylesheet">
  <link rel="stylesheet" href="style.css" media="screen" charset="utf-8">
</head>

<body>
  <header class="header">
    <img src="./eisenhower-matrix.jpg" alt="matrix" class="header-image">
    <a class="more_inf" href="https://goal-life.com/page/method/matrix-eisenhower">Want more details ?</a>
  </header>
  <main class="container">
    <section id="topSectionForAddingElementToList">
      <h2 id="focus-input" class="add-title"> Add Item</h2>
      <form class="task-row-wrapper">
        <input id="new-task" class="task add-task-input" type="text">
        <button type="button" class="button">Add</button>
      </form>
    </section>
    <section>
      <h3 class="list-title">Todo</h3>
      <ul id="incompleteTasks" class="list">
        <li class="todo-item">
          <input type="checkbox" class="checkbox">
          <label class="task-label">Pay Bills</label>
          <input type="text" class="task">
          <button class="button edit">Edit</button>
          <button class="button delete">
            <img class="remove" src="./remove.svg" alt="remove">
          </button>
        </li>
        <li class="editMode todo-item">
          <input type="checkbox" class="checkbox">
          <label class="task-label">Go Shopping</label>
          <input type="text" value="Go Shopping" class="task">
          <button class="button edit">Save</button>
          <button class="button delete">
            <img class="remove" src="./remove.svg" alt="remove">
          </button>
        </li>
      </ul>
    </section>
    <section>
      <h3 class="list-title">Completed</h3>
      <ul id="completed-tasks" class="list">
        <li class="todo-item">
          <input class="checkbox" type="checkbox" checked>
          <label class="task-label completed-line">See the Doctor</label>
          <input type="text" class="task">
          <button class="button edit">Edit</button>
          <button class="button delete">
            <img class="remove" src="./remove.svg" alt="remove"></button>
        </li>
      </ul>
    </section>
  </main>
  <script src="app.js"></script>
</body>

</html>
